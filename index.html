<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King of Nifty | Premium Trading Signals</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sora:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --pitch-black: #000000;
            --dark-grey: #0a0a0a;
        }

        * {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--pitch-black);
            color: white;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        h1, h2, .sora {
            font-family: 'Sora', sans-serif;
        }

        /* Pure Dark Background with Subtle Chart Vibe */
        .hero-bg {
            background: 
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
                linear-gradient(120deg, #0a0a0a 0%, #000000 100%);
            position: relative;
        }

        /* Subtle Grid Pattern for Trading Vibe */
        .grid-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
            z-index: 0;
        }

        /* Dark Glassmorphism Card */
        .dark-glass {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .dark-glass:active {
            transform: scale(0.98);
            border-color: rgba(255, 215, 0, 0.3);
        }

        /* Gold Gradient Text */
        .gold-text {
            background: linear-gradient(to right, #FFD700, #FFFACD, #B8860B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Glowing Gold CTA Button */
        .cta-btn {
            position: relative;
            background: linear-gradient(90deg, #FFD700, #B8860B);
            color: #000;
            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.5);
            z-index: 2;
        }
        .cta-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #FFD700, #B8860B);
            filter: blur(20px);
            opacity: 0.5;
            z-index: -1;
            transition: opacity 0.3s;
        }
        .cta-btn:active {
            transform: scale(0.96);
        }

        /* Floating Animation for Logo Container */
        .logo-container {
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start hero-bg">

    <!-- Background Grid -->
    <div class="grid-pattern"></div>

    <!-- Main Mobile Container -->
    <div class="w-full max-w-md mx-auto flex flex-col min-h-screen px-6 py-10 relative z-10">
        
        <!-- Logo Section -->
        <div class="flex flex-col items-center text-center mt-8">
            <!-- Linked Image Logo -->
            <a href="https://t.me/+umDgl6x97CllNjVl" target="_blank" class="logo-container relative w-32 h-32 mb-6 block rounded-full overflow-hidden border-2 border-yellow-500/50">
                <img src="King.jpeg" alt="King of Nifty Academy" class="w-full h-full object-cover">
            </a>
            
            <h1 id="brand-name" class="text-4xl font-extrabold tracking-wide sora">
                KING OF <span class="gold-text">NIFTY</span>
            </h1>
            <p id="tagline" class="text-gray-500 mt-2 text-xs tracking-[0.3em] uppercase">India’s #1 Trading Community</p>
        </div>

        <!-- Value Points (Dark Glass Cards) -->
        <div id="features" class="grid grid-cols-1 gap-3 mt-10 mb-auto">
            
            <!-- Card 1 -->
            <div class="feature-card dark-glass rounded-2xl p-4 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-yellow-500/5 border border-yellow-500/10 flex items-center justify-center flex-shrink-0">
                    <svg class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-lg text-white">98% Accuracy Rate</h3>
                    <p class="text-gray-500 text-sm">Expert technical analysis & research.</p>
                </div>
                <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </div>

            <!-- Card 2 -->
            <div class="feature-card dark-glass rounded-2xl p-4 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-yellow-500/5 border border-yellow-500/10 flex items-center justify-center flex-shrink-0">
                    <svg class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-lg text-white">Instant Live Alerts</h3>
                    <p class="text-gray-500 text-sm">Real-time entry & exit on Telegram.</p>
                </div>
                <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </div>

            <!-- Card 3 -->
            <div class="feature-card dark-glass rounded-2xl p-4 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-yellow-500/5 border border-yellow-500/10 flex items-center justify-center flex-shrink-0">
                    <svg class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-lg text-white">50,000+ Traders</h3>
                    <p class="text-gray-500 text-sm">Join the fastest-growing family.</p>
                </div>
                <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </div>

        </div>

        <!-- Main CTA Section -->
        <div id="cta-section" class="mt-8 mb-4 text-center relative">
            <div class="absolute inset-x-4 top-2 bottom-2 bg-yellow-500/20 blur-2xl rounded-full -z-10"></div>
            
            <a href="https://t.me/+umDgl6x97CllNjVl" target="_blank" class="cta-btn w-full block py-5 rounded-2xl text-lg uppercase tracking-wider mb-4">
                <div class="flex items-center justify-center space-x-3">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.327-.912.487-1.297.487-.428 0-1.254-.243-1.865-.442-.752-.245-1.349-.374-1.297-.789.027-.216.324-.437.892-.662 3.516-1.532 5.858-2.543 7.027-3.033 3.344-1.39 4.035-1.634 4.487-1.642z"/></svg>
                    <span>Join Free Telegram</span>
                </div>
            </a>
            <p class="text-gray-600 text-[10px] tracking-widest uppercase">100% Free • Limited Slots Available</p>
        </div>

    </div>

    <!-- Fixed Bottom Sticky CTA Button -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-black/80 backdrop-blur-md border-t border-white/10 z-50 flex justify-center">
        <a href="https://t.me/+umDgl6x97CllNjVl" target="_blank" class="cta-btn w-full max-w-md block py-3.5 rounded-xl text-base uppercase tracking-wider text-center">
            <div class="flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.327-.912.487-1.297.487-.428 0-1.254-.243-1.865-.442-.752-.245-1.349-.374-1.297-.789.027-.216.324-.437.892-.662 3.516-1.532 5.858-2.543 7.027-3.033 3.344-1.39 4.035-1.634 4.487-1.642z"/></svg>
                <span>Join Channel Now</span>
            </div>
        </a>
    </div>

    <!-- GSAP Script for Animations -->
    <script>
        const tl = gsap.timeline({ defaults: { ease: "power3.out", duration: 0.8 } });

        tl.from(".logo-container", { scale: 0.5, opacity: 0, delay: 0.2 })
          .from("#brand-name", { y: 20, opacity: 0 }, "-=0.4")
          .from("#tagline", { y: 20, opacity: 0 }, "-=0.6")
          .from(".feature-card", { y: 40, opacity: 0, stagger: 0.2 }, "-=0.4")
          .from("#cta-section", { y: 30, opacity: 0 }, "-=0.4");

        // Continuous pulsing glow on CTA buttons
        gsap.to(".cta-btn::after", {
            opacity: 0.8,
            duration: 1,
            repeat: -1,
            yoyo: true,
            ease: "power1.inOut"
        });
        
        // Pulse buttons slightly
        gsap.to(".cta-btn", {
            scale: 1.02,
            duration: 1.2,
            repeat: -1,
            yoyo: true,
            ease: "power1.inOut",
            delay: 1.5
        });
    </script>
</body>
</html>
